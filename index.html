  <!-- CLICK HANDLER -->
  <script>
    (() => {
      const overlay = document.getElementById('overlay');
      const music = document.getElementById('music');
      const blurEffect = document.getElementById('blurEffect');
      const windowBox = document.querySelector('.clear-window');

      overlay.addEventListener('click', () => {
        overlay.classList.add('hidden');
        music.play().catch(() => {});
        blurEffect.style.opacity = '1';
        windowBox.classList.add('show');
      });
    })();
  </script>

  <!-- ✅ FIXED TYPING SCRIPT (NO GLITCH, MOBILE SAFE) -->
  <script>
    class TypeWriter {
      constructor(el, words, wait = 2000) {
        this.el = el;
        this.words = words;
        this.wait = wait;
        this.txt = '';
        this.wordIndex = 0;
        this.isDeleting = false;
        this.type();
      }

      type() {
        const current = this.wordIndex % this.words.length;
        const full = this.words[current];

        if (this.isDeleting) {
          this.txt = full.substring(0, this.txt.length - 1);
        } else {
          this.txt = full.substring(0, this.txt.length + 1);
        }

        this.el.querySelector('.wrap').textContent = this.txt;

        let speed = this.isDeleting ? 70 : 120;

        if (!this.isDeleting && this.txt === full) {
          speed = this.wait;
          this.isDeleting = true;
        } else if (this.isDeleting && this.txt === '') {
          this.isDeleting = false;
          this.wordIndex++;
          speed = 400;
        }

        setTimeout(() => this.type(), speed);
      }
    }

    window.addEventListener('load', () => {
      document.querySelectorAll('.typewrite').forEach(el => {
        new TypeWriter(
          el,
          JSON.parse(el.getAttribute('data-type')),
          parseInt(el.getAttribute('data-period'), 10)
        );
      });
    });
  </script>

  <!-- MATRIX BACKGROUND -->
  <script>
    (() => {
      const canvas = document.getElementById('matrixCanvas');
      const ctx = canvas.getContext('2d');

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      const chars = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリギジヂビピウゥクスツヌフムユュルグズブプエェケセテネヘメレゲゼデベペオォコソトノホモヨョロゴゾドボポ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const fontSize = 16;
      const columns = Math.floor(canvas.width / fontSize);
      const drops = Array(columns).fill(0);
      const colors = ['#ffffff', '#fc0324'];

      function draw() {
        ctx.fillStyle = 'rgba(0,0,0,0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = fontSize + 'px monospace';

        for (let i = 0; i < drops.length; i++) {
          const text = chars[Math.floor(Math.random() * chars.length)];
          ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
          ctx.fillText(text, i * fontSize, drops[i] * fontSize);

          if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
          }
          drops[i]++;
        }

        requestAnimationFrame(draw);
      }

      draw();
    })();
  </script>
